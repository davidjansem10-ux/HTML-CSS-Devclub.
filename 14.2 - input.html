<!--continuando a aula de input-->

    <h2> QUAL SUA REDE SOCIAL FAVORITA ?</h2>
    <br>
    <label for="facebook">Facebook</label>
    <input type="radio" id="facebook" name="rede-social"/> 
    <br>
    
    <label for="instagram">Instagram</label>
    <input type="radio" id="instagram" name="rede-social"/>
    <br> 

    <label for="youtube">youtube</label>
    <input type="radio" id="youtube" name="rede-social"/>
    <br>
    <br>
    <!-- o input type=radio aparece um circulo para selecionar uma opção, 
    e o name serve para agrupar as opções, ou seja, só pode selecionar uma opção do mesmo name-->
